name: Publish release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        default: v1.1.0

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release ref $RELEASE_TAG is not an exact Git tag" >&2
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out commit is not the commit named by $RELEASE_TAG" >&2
            exit 1
          fi
          package_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
          adapter_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("adapters/reference_workspace_action/pyproject.toml").read_text())["project"]["version"])')"
          if [ "$adapter_version" != "0.5.0" ]; then
            echo "Reference workspace adapter version must be 0.5.0; found $adapter_version" >&2
            exit 1
          fi

      - name: Validate separate adapter dependency boundary
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(
              pathlib.Path("adapters/reference_workspace_action/pyproject.toml").read_text()
          )["project"]
          assert project["name"] == "ace-reference-workspace-action"
          assert project["dependencies"] == ["ace-core>=0.8.0,<2"]
          PY

      - name: Validate attached artifacts admit the released core
        run: |
          python -m pip install --disable-pip-version-check packaging==25.0
          python - <<'PY'
          import pathlib
          import tomllib

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          release = Version(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          for pyproject in sorted(
              [
                  *pathlib.Path("adapters").glob("*/pyproject.toml"),
                  *pathlib.Path("domain_packs").glob("*/pyproject.toml"),
                  *pathlib.Path("solution_bundles").glob("*/pyproject.toml"),
              ]
          ):
              project = tomllib.loads(pyproject.read_text())["project"]
              for item in project.get("dependencies", ()):
                  requirement = Requirement(item)
                  if canonicalize_name(requirement.name) != "ace-core":
                      continue
                  assert requirement.specifier.contains(release, prereleases=True), (
                      f"{pyproject} pins {requirement.specifier}, which refuses the ace-core {release} "
                      "being released beside it"
                  )
          PY

      - name: Install build tooling
        run: >-
          python -m pip install --disable-pip-version-check
          build==1.5.0 setuptools==83.0.0 twine==7.0.0

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build and validate distributions
        run: |
          python -m build --outdir dist/core
          python -m build --outdir dist/reference-adapter adapters/reference_workspace_action
          for adapter in adapters/local_*/; do
            python -m build --outdir dist/local-adapters "$adapter"
          done
          python -m build --outdir dist/pack domain_packs/personal_intelligence
          python -m build --outdir dist/bundle solution_bundles/personal_intelligence

          # The root project uses build_backend.py directly. The independently packaged
          # setuptools projects (the reference adapter and the local-source adapter family)
          # need their completed sdists normalized through the same fixed-epoch helper before
          # validation and upload; the hatchling-built pack and bundle honor
          # SOURCE_DATE_EPOCH natively.
          python - <<'PY'
          import os
          from pathlib import Path

          from build_backend import _normalize_sdist

          reference = sorted(Path("dist/reference-adapter").glob("*.tar.gz"))
          assert len(reference) == 1, reference
          local = sorted(Path("dist/local-adapters").glob("*.tar.gz"))
          expected = sorted(item.name for item in Path("adapters").glob("local_*") if item.is_dir())
          assert len(local) == len(expected), (local, expected)
          for archive in reference + local:
              _normalize_sdist(archive, int(os.environ["SOURCE_DATE_EPOCH"]))
          PY

          python -m twine check dist/core/* dist/reference-adapter/* dist/local-adapters/* dist/pack/* dist/bundle/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ace-core-python-distributions
          path: dist/core/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-workspace-action-distributions
          path: dist/reference-adapter/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-source-adapter-distributions
          path: dist/local-adapters/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-intelligence-pack-distributions
          path: dist/pack/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-intelligence-bundle-distributions
          path: dist/bundle/

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ace-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ace-core-python-distributions
          path: dist/core/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/core/

  release-reference-adapter:
    name: Attach independently packaged artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reference-workspace-action-distributions
          path: dist/reference-adapter/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: local-source-adapter-distributions
          path: dist/local-adapters/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-intelligence-pack-distributions
          path: dist/pack/

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: personal-intelligence-bundle-distributions
          path: dist/bundle/

      - name: Attach independently packaged artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/reference-adapter/* dist/local-adapters/* dist/pack/* dist/bundle/*
          --repo "$GITHUB_REPOSITORY" --clobber
