name: Publish release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release ref $RELEASE_TAG is not an exact Git tag" >&2
            exit 1
          fi
          if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out commit is not the commit named by $RELEASE_TAG" >&2
            exit 1
          fi
          package_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
          adapter_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("adapters/reference_workspace_action/pyproject.toml").read_text())["project"]["version"])')"
          if [ "$adapter_version" != "0.4.1" ]; then
            echo "Reference workspace adapter version must be 0.4.1; found $adapter_version" >&2
            exit 1
          fi

      - name: Validate separate adapter dependency boundary
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(
              pathlib.Path("adapters/reference_workspace_action/pyproject.toml").read_text()
          )["project"]
          assert project["name"] == "ace-reference-workspace-action"
          assert project["dependencies"] == ["ace-core>=0.8.0,<1.1"]
          PY

      - name: Install build tooling
        run: >-
          python -m pip install --disable-pip-version-check
          build==1.5.0 setuptools==83.0.0 twine==7.0.0

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build and validate distributions
        run: |
          python -m build --outdir dist/core
          python -m build --outdir dist/reference-adapter adapters/reference_workspace_action

          # The root project uses build_backend.py directly. The independently packaged adapter
          # uses setuptools, so normalize its completed sdist through the same fixed-epoch helper
          # before validation and upload.
          python - <<'PY'
          import os
          from pathlib import Path

          from build_backend import _normalize_sdist

          archives = sorted(Path("dist/reference-adapter").glob("*.tar.gz"))
          assert len(archives) == 1, archives
          _normalize_sdist(archives[0], int(os.environ["SOURCE_DATE_EPOCH"]))
          PY

          python -m twine check dist/core/* dist/reference-adapter/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ace-core-python-distributions
          path: dist/core/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-workspace-action-distributions
          path: dist/reference-adapter/

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ace-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ace-core-python-distributions
          path: dist/core/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/core/

  release-reference-adapter:
    name: Attach reference action adapter
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reference-workspace-action-distributions
          path: dist/reference-adapter/

      - name: Attach independently packaged adapter to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/reference-adapter/* --repo "$GITHUB_REPOSITORY" --clobber
