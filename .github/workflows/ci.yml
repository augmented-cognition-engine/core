name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Run ruff (lint + format check)
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Tests (fast gate)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Run fast tests (no e2e)
        run: uv run pytest -m "not e2e" -q --tb=short

  naked-kernel:
    name: Naked kernel (zero extensions)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Kernel tests with all extensions disabled
        run: |
          ACE_DISABLE_EXTENSIONS=1 uv run pytest -m "not e2e and not requires_extensions" -q --tb=short
          uv run pytest tests/test_kernel_boundary.py -q

  canvas:
    name: Canvas (core/ui/canvas)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install canvas dependencies
        working-directory: core/ui/canvas
        run: npm ci
      - name: Typecheck
        working-directory: core/ui/canvas
        run: npx tsc --noEmit
      # Vitest includes the TS kernel-boundary guard
      # (src/design/__enforcement__/noExtensionLeakage.test.ts) — the UI sibling
      # of tests/test_kernel_boundary.py. With no extensions present it confirms
      # no src file imports from extensions/ or names an extension brand.
      - name: Vitest
        working-directory: core/ui/canvas
        run: npx vitest run --reporter=basic
      # NAKED posture is the ONLY posture in the public tree: no src/app/ext/
      # extension wiring is present — import.meta.glob finds nothing and the
      # canvas mounts kernel routes alone.
      - name: Build (naked posture — zero extensions)
        working-directory: core/ui/canvas
        run: npx vite build
      # core/engine/atrium/static is a COMMITTED build artifact: it is what the
      # Python package serves, so a UI change that is not rebuilt into it never
      # reaches an installed artifact. Nothing else rebuilds or checks it, and a
      # stale bundle is invisible — it serves an older Atrium perfectly happily.
      # Rebuild and fail if the committed bundle differs from current source.
      - name: Packaged Atrium bundle is current
        working-directory: core/ui/canvas
        run: npm run build:package
      - name: Fail if the committed Atrium bundle is stale
        run: |
          if [ -n "$(git status --porcelain core/engine/atrium/static)" ]; then
            echo "::error::The committed Atrium bundle does not match core/ui/canvas source."
            echo "Run 'npm run build:package' in core/ui/canvas and commit core/engine/atrium/static."
            git status --porcelain core/engine/atrium/static
            exit 1
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Vulnerability scan (pip-audit)
        # No suppressions: the tree audits clean. (CVE-2025-3000 was fixed by
        # torch 2.13; the former --ignore-vuln for it is gone. If a future
        # advisory has no fix, add an explicit --ignore-vuln here with a reason.)
        #
        # --skip-editable excludes the root project, which `uv sync` installs
        # editable. Auditing ace-core against PyPI is meaningless -- it resolves
        # our own package -- and it fails outright on any release commit, because
        # the version bump necessarily precedes publication. Dependencies, which
        # are what this job exists to scan, are unaffected.
        run: uv run pip-audit --skip-editable

  pi13-ws0:
    name: PI13 WS0 — Personal J1-J10 (allowed failure)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 35
    # Allowed failure: WS0 is an observability gate, not a merge gate. The
    # runner step itself must stay strict (no || true) so a red run is visible.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"
      - name: Install build tooling
        run: python -m pip install build==1.5.0 setuptools==83.0.0
      - name: Build wheels (Core + local adapters + PI pack + PI bundle)
        run: |
          mkdir -p "$RUNNER_TEMP/pi13-ws0-dist"
          python -m build --wheel --outdir "$RUNNER_TEMP/pi13-ws0-dist" .
          for adapter in adapters/local_*; do
            python -m build --wheel --outdir "$RUNNER_TEMP/pi13-ws0-dist" "$adapter"
          done
          python -m build --wheel --outdir "$RUNNER_TEMP/pi13-ws0-dist" domain_packs/personal_intelligence
          python -m build --wheel --outdir "$RUNNER_TEMP/pi13-ws0-dist" solution_bundles/personal_intelligence
      - name: Create install venv outside the workspace
        run: |
          python -m venv "$RUNNER_TEMP/pi13-ws0-venv"
          "$RUNNER_TEMP/pi13-ws0-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/pi13-ws0-venv/bin/pip" install "$RUNNER_TEMP"/pi13-ws0-dist/*.whl
      - name: Start disposable SurrealDB (in-memory, no volume)
        run: |
          docker run -d --name pi13-ws0-surreal -p 18130:8000 \
            surrealdb/surrealdb:v3.2.3 \
            start --username root --password root --bind 0.0.0.0:8000 memory
          for attempt in $(seq 1 30); do
            if docker exec pi13-ws0-surreal /surreal is-ready --endpoint http://localhost:8000; then
              exit 0
            fi
            sleep 2
          done
          echo "SurrealDB never became ready" >&2
          docker logs pi13-ws0-surreal >&2 || true
          exit 1
      - name: Apply schema from the installed package
        working-directory: ${{ runner.temp }}
        env:
          SURREAL_URL: ws://localhost:18130
          SURREAL_USER: root
          SURREAL_PASS: root
          SURREAL_NS: ace
          SURREAL_DB: ace
          JWT_SECRET: pi13-ws0-ci-only-not-a-secret
          REQUIRE_SUBSCRIPTION: "0"
        run: '"$RUNNER_TEMP/pi13-ws0-venv/bin/python" -m scripts.schema_apply'
      - name: Run J1-J10 journey gate (installed venv, stub model)
        working-directory: ${{ runner.temp }}
        env:
          SURREAL_URL: ws://localhost:18130
          SURREAL_USER: root
          SURREAL_PASS: root
          SURREAL_NS: ace
          SURREAL_DB: ace
          JWT_SECRET: pi13-ws0-ci-only-not-a-secret
          REQUIRE_SUBSCRIPTION: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/pi13-ws0-report"
          "$RUNNER_TEMP/pi13-ws0-venv/bin/python" "$GITHUB_WORKSPACE/scripts/pi13_ws0_journey_gate.py" \
            --repository-root "$GITHUB_WORKSPACE" \
            --fixture-corpus "$GITHUB_WORKSPACE/tests/fixtures/pi13_ws0" \
            --json-report "$RUNNER_TEMP/pi13-ws0-report/journey_gate.json" \
            --markdown-report "$RUNNER_TEMP/pi13-ws0-report/journey_gate.md"
      - name: Publish journey report to step summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pi13-ws0-report/journey_gate.md" ]; then
            cat "$RUNNER_TEMP/pi13-ws0-report/journey_gate.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload journey report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi13-ws0-journey-report
          path: ${{ runner.temp }}/pi13-ws0-report
          if-no-files-found: error
      - name: Tear down SurrealDB container
        if: always()
        run: docker rm -f pi13-ws0-surreal || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build --no-cache -t ace-engine:ci .
      - name: Verify health endpoint exists in image
        run: |
          docker run --rm -d --name ace-ci -p 3999:3000 ace-engine:ci || true
          sleep 5
          docker stop ace-ci 2>/dev/null || true
